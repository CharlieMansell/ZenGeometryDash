name: Build Zen Geometry Dash

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows desktop app (Electron): a real installer + portable exe,
  # no console window, no browser tab.
  build-windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check levels are playable
        run: node tools/check-levels.mjs

      - name: Install Electron tooling
        run: npm ci

      - name: Build Windows installer + portable exe
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            dist/ZenGeometryDash-Setup.exe
            dist/ZenGeometryDash-Portable.exe

  # Lightweight Go server builds for macOS / Linux (game opens in browser)
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build macOS binary (Apple Silicon)
        run: GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/ZenGeometryDash-mac .

      - name: Build Linux binary
        run: GOOS=linux GOARCH=amd64 go build -trimpath -o dist/ZenGeometryDash-linux .

      - uses: actions/upload-artifact@v4
        with:
          name: server-binaries
          path: dist/

  release:
    if: github.event_name == 'push'
    needs: [build-windows-app, build-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      # Every push to the default branch refreshes the "latest" release,
      # so the download link for Zen never changes.
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Zen Geometry Dash — Latest Build
          body: |
            ### 🎮 For Zen: download **ZenGeometryDash-Setup.exe** below!

            Run it once and the game installs with a desktop shortcut — after
            that just double-click the shortcut to play.

            - **ZenGeometryDash-Setup.exe** — Windows installer (recommended)
            - **ZenGeometryDash-Portable.exe** — single-file version, no install
            - **ZenGeometryDash-mac / -linux** — opens the game in your browser

            Windows may show a SmartScreen warning the first time — click
            "More info" → "Run anyway". That's just because the app isn't
            code-signed.
          files: dist/*
          prerelease: false

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
